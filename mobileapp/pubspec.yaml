name: mobileapp
description: "AI-Powered Visual Guidance System - Hệ thống dẫn đường thông minh cho người khiếm thị"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Camera
  camera: ^0.11.0+1

  # Networking
  web_socket_channel: ^3.0.1
  http: ^1.2.2

  # Voice & Audio
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0
  audioplayers: ^6.1.0

  # Location
  geolocator: ^13.0.2

  # Permissions
  permission_handler: ^11.3.1

  # Storage (lưu cài đặt IP server)
  shared_preferences: ^2.3.4

  # Typography
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
