name: Build Android APK

on:
  push:
    branches: [ feature/mobileapp-update ]
  pull_request:
    branches: [ feature/mobileapp-update ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.47.9'
        channel: 'stable'
        cache: true

    - name: Get dependencies
      working-directory: ./mobileapp
      run: flutter pub get

    - name: Build APK
      working-directory: ./mobileapp
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: mobileapp/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
