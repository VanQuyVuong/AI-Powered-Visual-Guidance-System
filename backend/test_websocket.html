<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Real-time Video Tracking</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: white; }
        .video-container { position: relative; display: inline-block; width: 640px; max-width: 100%; border: 2px solid #4CAF50; border-radius: 8px; overflow: hidden; }
        video { width: 100%; display: block; }
        /* Canvas vẽ đè lên trên video */
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #logs { margin-top: 20px; padding: 10px; background: #222; border-radius: 8px; height: 150px; overflow-y: auto; text-align: left; width: 640px; display: inline-block; }
    </style>
</head>
<body>
    <h2>Thử nghiệm Real-time Tracking & Bounding Box</h2>
    
    <button id="startBtn" style="padding: 20px 40px; font-size: 24px; background-color: #4CAF50; color: white; border: none; border-radius: 10px; cursor: pointer; margin-bottom: 20px; font-weight: bold; width: 640px; max-width: 100%;">🔴 BẤM VÀO ĐÂY ĐỂ BẮT ĐẦU</button>
    <br>

    <div class="video-container">
        <video id="video" autoplay playsinline></video>
        <canvas id="overlay"></canvas>
    </div>
    <br>
    
    <div id="logs">Đang chờ kết nối...<br></div>

    <script>
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const ctx = overlay.getContext('2d');
        const logs = document.getElementById('logs');
        const startBtn = document.getElementById('startBtn');
        let ws;
        let videoWidth = 0;
        let videoHeight = 0;

        // Bật Camera
        navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                videoWidth = video.videoWidth;
                videoHeight = video.videoHeight;
                // Chỉnh kích thước canvas overlay khớp với kích thước video thực
                overlay.width = videoWidth;
                overlay.height = videoHeight;
            };
        }).catch(err => {
            logs.innerHTML += `<span style="color:red">Lỗi Camera: ${err}</span><br>`;
        });

        startBtn.onclick = () => {
            if(ws && ws.readyState === WebSocket.OPEN) return;
            
            logs.innerHTML += `Đang kết nối tới WebSocket Server...<br>`;
            ws = new WebSocket("ws://localhost:8000/api/v1/vision/stream");
            
            ws.onopen = () => {
                logs.innerHTML += `<span style="color:green">Đã kết nối! Bắt đầu phân tích...</span><br>`;
                startBtn.innerText = "Đang chạy AI...";
                setInterval(sendFrame, 300); 
            };
            
            ws.onmessage = (event) => {
                const res = JSON.parse(event.data);
                
                // Xóa canvas cũ
                ctx.clearRect(0, 0, overlay.width, overlay.height);
                
                // 1. Vẽ Vùng Quan Tâm (ROI) - Hình quạt/thang (Nửa dưới, bỏ 20% 2 bên)
                ctx.fillStyle = "rgba(0, 255, 0, 0.2)"; // Màu xanh lá trong suốt
                ctx.strokeStyle = "#00FF00";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(videoWidth * 0.2, videoHeight * 0.4); // Góc trên trái của ROI
                ctx.lineTo(videoWidth * 0.8, videoHeight * 0.4); // Góc trên phải của ROI
                ctx.lineTo(videoWidth * 0.8, videoHeight);       // Góc dưới phải
                ctx.lineTo(videoWidth * 0.2, videoHeight);       // Góc dưới trái
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // 2. Vẽ Bounding Box cho từng vật thể lọt vào vùng
                if(res.objects && res.objects.length > 0) {
                    const objTexts = [];
                    res.objects.forEach(obj => {
                        objTexts.push(`[${obj.class_name}] (${obj.position})`);
                        
                        // Vẽ khung đỏ báo động
                        if(obj.bounding_box) {
                            ctx.strokeStyle = "red";
                            ctx.lineWidth = 3;
                            ctx.strokeRect(
                                obj.bounding_box.x1, 
                                obj.bounding_box.y1, 
                                obj.bounding_box.x2 - obj.bounding_box.x1, 
                                obj.bounding_box.y2 - obj.bounding_box.y1
                            );
                            
                            // Vẽ tên
                            ctx.fillStyle = "red";
                            ctx.font = "bold 20px Arial";
                            ctx.fillText(`${obj.class_name}`, obj.bounding_box.x1, obj.bounding_box.y1 - 5);
                        }
                    });
                    logs.innerHTML = `<span style="color:yellow">CẢNH BÁO: ${objTexts.join(", ")}</span><br>` + logs.innerHTML;
                }
            };
            
            ws.onclose = () => logs.innerHTML += `<span style="color:red">Bị mất kết nối!</span><br>`;
        };

        function sendFrame() {
            if(!ws || ws.readyState !== WebSocket.OPEN || videoWidth === 0) return;
            const canvas = document.createElement("canvas");
            canvas.width = videoWidth;
            canvas.height = videoHeight;
            canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
            const base64Data = canvas.toDataURL("image/jpeg", 0.6); // Nén nhẹ hình ảnh
            ws.send(base64Data);
        }
    </script>
</body>
</html>
